// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    // 移除用户级 init 脚本（~/.gradle/init.gradle）注入的不可用镜像。
    // 本机该镜像缺 org.apache.cordova:framework:14.0.1，会导致 :app 解析失败；
    // 没有配置该镜像的机器上这段不产生任何影响。
    repositories.removeAll { r ->
        r instanceof MavenArtifactRepository && r.url.toString().contains('bmclapi')
    }
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
